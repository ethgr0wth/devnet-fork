<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DevNetwork</title>
    <link rel="stylesheet" href="/static/styles.css?v={{ css_ver }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <meta name="theme-color" content="#09090b">
    <style>
        html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; }
        #app { 
          height: 100vh; 
          height: 100dvh;
          display: flex; 
          flex-direction: column;
          padding-bottom: env(safe-area-inset-bottom, 0);
          padding-top: env(safe-area-inset-top, 0);
          padding-left: env(safe-area-inset-left, 0);
          padding-right: env(safe-area-inset-right, 0);
        }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }
        .mb-safe { margin-bottom: env(safe-area-inset-bottom, 0); }
        
        .dm-markdown { color: inherit !important; }
        .dm-markdown * { color: inherit !important; }
        .dm-markdown strong, .dm-markdown b { font-weight: 700 !important; color: inherit !important; }
        .dm-markdown em, .dm-markdown i { font-style: italic !important; color: inherit !important; }
        .dm-markdown code { background: rgba(0,0,0,0.1) !important; padding: 2px 6px !important; border-radius: 4px !important; font-family: monospace !important; color: #0f172a !important; }
        .dm-markdown pre { background: rgba(0,0,0,0.08) !important; padding: 12px !important; border-radius: 8px !important; overflow-x: auto !important; }
        .dm-markdown pre code { background: none !important; padding: 0 !important; color: #1e293b !important; display: block !important; }
        .dm-markdown ul, .dm-markdown ol { margin: 8px 0 !important; padding-left: 20px !important; }
        .dm-markdown li { margin: 4px 0 !important; }
        .dm-markdown p { margin: 6px 0 !important; }
        .dm-markdown a { color: #2563eb !important; text-decoration: underline !important; }
        .dm-markdown h1, .dm-markdown h2, .dm-markdown h3 { font-weight: 700 !important; margin: 10px 0 6px !important; }
        
        .bg-emerald-600 .dm-markdown code { background: rgba(255,255,255,0.2) !important; color: #fff !important; }
        .bg-emerald-600 .dm-markdown pre { background: rgba(0,0,0,0.2) !important; }
        .bg-emerald-600 .dm-markdown pre code { color: #fff !important; }
        .bg-emerald-600 .dm-markdown a { color: #a7f3d0 !important; }
    </style>
</head>
<body class="bg-zinc-950">
    <div id="app">
        <div id="window-titlebar" style="-webkit-app-region: drag;">
            <div class="titlebar-glow-line"></div>
            <div class="titlebar-content">
                <div class="titlebar-dots">
                    <div class="titlebar-dot dot-red"></div>
                    <div class="titlebar-dot dot-yellow"></div>
                    <div class="titlebar-dot dot-green"></div>
                </div>
                <div class="logo-plaque">
                    <div class="logo-plaque-inner">
                        <img src="/static/logo-icon-dark.png" alt="DevNetwork" class="logo-plaque-img" width="24" height="24">
                        <span class="logo-plaque-text">devnet</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="app-container" class="flex-1 flex overflow-hidden">
            <aside id="sidebar" class="sidebar-expanded bg-zinc-900 border-r border-zinc-800 flex flex-col py-3 px-2 hidden transition-all duration-300">
                <div id="ecosystem-switcher" class="pb-3 mb-2 border-b border-zinc-800 flex flex-col gap-1 hidden">
                    <div id="ecosystem-list" class="flex flex-col gap-1"></div>
                    <button id="eco-explore-btn" class="sidebar-btn" title="Explore Ecosystems">
                        <i data-lucide="compass" class="w-5 h-5 flex-shrink-0"></i>
                        <span class="sidebar-label">Explore</span>
                    </button>
                </div>
                <div class="flex-1 flex flex-col gap-1">
                    <button id="nav-feed" class="sidebar-btn" title="Feed">
                        <i data-lucide="newspaper" class="w-5 h-5 flex-shrink-0"></i>
                        <span class="sidebar-label">Feed</span>
                    </button>
                    <button id="nav-explore" class="sidebar-btn" title="Explore">
                        <i data-lucide="search" class="w-5 h-5 flex-shrink-0"></i>
                        <span class="sidebar-label">Explore</span>
                    </button>
                    <button id="nav-groups" class="sidebar-btn" title="Communities">
                        <i data-lucide="users" class="w-5 h-5 flex-shrink-0"></i>
                        <span class="sidebar-label">Communities</span>
                    </button>
                    <button id="nav-messages" class="sidebar-btn" title="Messages">
                        <i data-lucide="message-square" class="w-5 h-5 flex-shrink-0"></i>
                        <span class="sidebar-label">Messages</span>
                    </button>
                    <button id="nav-notifications" class="sidebar-btn relative" title="Pings">
                        <i data-lucide="bell" class="w-5 h-5 flex-shrink-0"></i>
                        <span class="sidebar-label">Pings</span>
                        <span id="notification-badge" class="notification-badge-expanded ml-auto w-5 h-5 bg-emerald-500 rounded-full text-[10px] text-white font-bold flex items-center justify-center hidden">0</span>
                    </button>
                    <button id="nav-geppetto" class="sidebar-btn" title="Bots">
                        <i data-lucide="bot" class="w-5 h-5 flex-shrink-0"></i>
                        <span class="sidebar-label">Bots</span>
                    </button>
                    <button id="nav-docs" class="sidebar-btn" title="Docs">
                        <i data-lucide="book-open" class="w-5 h-5 flex-shrink-0"></i>
                        <span class="sidebar-label">Docs</span>
                    </button>
                    <button id="nav-admin" class="sidebar-btn hidden" title="Admin">
                        <i data-lucide="shield" class="w-5 h-5 flex-shrink-0"></i>
                        <span class="sidebar-label">Admin</span>
                    </button>
                </div>
                <div class="pt-3 border-t border-zinc-800 flex flex-col gap-1 safe-area-bottom">
                    <button id="nav-profile" class="sidebar-btn w-full" title="Profile">
                        <div id="nav-avatar-container" class="w-7 h-7 rounded-lg bg-zinc-800 flex items-center justify-center text-zinc-300 font-semibold text-xs overflow-hidden flex-shrink-0">
                            <span id="nav-avatar-initial">?</span>
                        </div>
                        <span id="nav-profile-name" class="sidebar-label truncate">Profile</span>
                    </button>
                    <button id="sidebar-toggle" class="sidebar-btn w-full" title="Collapse sidebar">
                        <i data-lucide="chevrons-left" class="w-5 h-5 sidebar-collapse-icon"></i>
                        <i data-lucide="chevrons-right" class="w-5 h-5 sidebar-expand-icon hidden"></i>
                        <span class="sidebar-label">Collapse</span>
                    </button>
                </div>
            </aside>

            <main id="main-content" class="flex-1 bg-zinc-950 overflow-y-auto">
                <div id="wizard-container" class="h-full w-full flex items-center justify-center relative overflow-hidden">
                    <canvas id="glitter-canvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>
                    <div class="bg-zinc-900/80 backdrop-blur-sm border border-zinc-800 rounded-xl p-8 text-center max-w-md w-full relative" style="z-index:1;">
                        <div class="relative inline-flex items-center justify-center w-14 h-14 mb-4">
                            <div class="absolute inset-0 bg-emerald-500/20 rounded-full animate-ping"></div>
                            <div class="relative w-10 h-10 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center">
                                <svg class="w-5 h-5 text-white animate-spin" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                                </svg>
                            </div>
                        </div>
                        <p class="text-zinc-400 text-sm">Initializing...</p>
                    </div>
                    <script>
                    (function(){
                      const c=document.getElementById('glitter-canvas');
                      if(!c)return;
                      const ctx=c.getContext('2d');
                      let w,h,particles=[];
                      function resize(){if(!c.parentElement)return;w=c.width=c.parentElement.offsetWidth;h=c.height=c.parentElement.offsetHeight;}
                      resize();
                      window.addEventListener('resize',resize);
                      for(let i=0;i<300;i++){
                        particles.push({
                          x:Math.random()*w,y:Math.random()*h,
                          r:Math.random()*2+0.5,
                          dx:(Math.random()-0.5)*0.4,
                          dy:(Math.random()-0.5)*0.4,
                          twinkle:Math.random()*Math.PI*2,
                          speed:0.02+Math.random()*0.04,
                          green:Math.random()>0.5
                        });
                      }
                      function draw(){
                        ctx.clearRect(0,0,w,h);
                        for(const p of particles){
                          p.x+=p.dx;p.y+=p.dy;
                          p.twinkle+=p.speed;
                          if(p.x<0)p.x=w;if(p.x>w)p.x=0;
                          if(p.y<0)p.y=h;if(p.y>h)p.y=0;
                          const alpha=0.3+Math.abs(Math.sin(p.twinkle))*0.7;
                          ctx.beginPath();
                          ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                          if(p.green){ctx.fillStyle=`rgba(16,185,129,${alpha})`;}
                          else{ctx.fillStyle=`rgba(255,255,255,${alpha})`;}
                          ctx.fill();
                        }
                        requestAnimationFrame(draw);
                      }
                      draw();
                    })();
                    </script>
                </div>
            </main>
        </div>

        <div id="status-bar" class="h-6 bg-zinc-900 border-t border-zinc-800 flex items-center justify-between px-3 text-[11px] text-zinc-500 safe-area-bottom">
            <div class="flex items-center gap-3">
                <span id="status-connection" class="flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    Connected
                </span>
                <span id="status-user" class="hidden"></span>
            </div>
            <div class="flex items-center gap-3">
                <span style="display: flex; align-items: center; gap: 4px;"><img src="/static/logo-icon-dark.png" alt="DevNetwork" style="height: 12px; object-fit: contain; opacity: 0.6;"> v2.2.2</span>
            </div>
        </div>
    </div>

    <script>
        window.REDIRECT_GROUP = "{{ redirect_group | default('') }}";
    </script>
    <script src="/static/app.js?v={{ js_ver }}"></script>
</body>
</html>
